services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rak
      POSTGRES_PASSWORD: rak
      POSTGRES_DB: rak_ai
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      # The API waits for this rather than for the container to exist. Postgres
      # accepts connections a second or two after the process starts.
      test: ["CMD-SHELL", "pg_isready -U rak -d rak_ai"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://rak:rak@db:5432/rak_ai
      SECRET_KEY: ${SECRET_KEY:-dev-only-change-me}
      CORS_ORIGINS: '["http://localhost:5173"]'
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata:
